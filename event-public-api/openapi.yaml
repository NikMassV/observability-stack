openapi: 3.0.3
info:
  title: Event Public API
  version: 1.0.0
  description: |
    Gateway gets events by UID. Proxies requests in event-consumer, return trace-id.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/events/{uid}:
    get:
      summary: Get event by UID
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: event UID
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
components:
  schemas:
    Event:
      type: object
      properties:
        uid:
          type: string
        subject:
          type: string
        description:
          type: string
        traceId:
          type: string
      required: [uid, subject, description, traceId]
